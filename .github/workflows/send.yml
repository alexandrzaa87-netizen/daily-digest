name: Send digest to Telegram

on:
  push:
    paths:
      - "digests/**.md"
  workflow_dispatch:
    inputs:
      file:
        description: "Путь к дайджесту для повторной отправки (например, digests/2026-10-27.md)"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Send new digests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES="${{ github.event.inputs.file }}"
          else
            FILES=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'digests/*.md' 2>/dev/null \
                    || git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'digests/*.md')
          fi
          echo "Файлы: $FILES"
          python send_telegram.py $FILES
